[workspace]
members = ["common", "core", "helper"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"

[workspace.dependencies]
itrampoline-runtime = { path = "common" }
rustix = { version = "=1.1.3", default-features = false, features = ["fs", "process", "runtime"] }
libc = "=0.2.189"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
